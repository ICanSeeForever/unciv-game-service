name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd /var/docker/compose/unciv-game-service
            git fetch origin && git reset --hard origin/main
            # Cached build (reuses the heavy pip/daemon layers) so the 2GB box doesn't
            # OOM on deploy; build first, then recreate the container in place so the
            # old backend keeps serving during the build and a failed build leaves it up.
            sudo docker compose build
            sudo docker compose up -d
