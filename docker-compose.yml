services:
  unciv-game-service:
    build: .
    container_name: unciv-game-service
    restart: unless-stopped
    ports:
      - "8085:8080"
    env_file:
      - .env
    environment:
      CIV_PATH: /data/unciv
      # Форвард-прокси (tinyproxy) для заливки крупных сейвов на uncivserver.xyz:
      # kingru-IP забанен Cloudflare-WAF, льём через germ, фолбэк на neth, затем прямой.
      UNCIV_UPLOAD_PROXY: "http://89.125.90.69:8888,http://185.223.93.39:8888"
    volumes:
      - ${CIV_PATH}:/data/unciv
      # Place Unciv.jar next to docker-compose.yml for local launcher
      - ./Unciv.jar:/opt/unciv/Unciv.jar
      # Read-only: core-service user cards (playerId -> telegram nick) for the viewer.
      - /var/docker/compose/unciv-core-service/data:/data/core:ro
    # Unciv.jar при генерации SYNC/локальных игр ходит на https://unciv.icanseeforever.com:8084
    # (TLS терминирует host-nginx на :8084 → проксирует в контейнер unciv-server).
    # Из контейнера имя резолвится публичным DNS в хост-IP, коннект идёт через
    # hairpin на host-nginx (проверено: HTTPS-GC из контейнера → 200). Прежний
    # plain-http alias «icanseeforever.com» на unciv-server больше не нужен для jar,
    # но оставлен в его compose как безвредный.
    networks:
      - civ_network

networks:
  civ_network:
    external: true
