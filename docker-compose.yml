services:
  unciv-game-service:
    build: .
    container_name: unciv-game-service
    restart: unless-stopped
    ports:
      - "8085:8080"
    env_file:
      - .env
    environment:
      CIV_PATH: /data/unciv
      # Форвард-прокси (tinyproxy) для заливки крупных сейвов на uncivserver.xyz:
      # kingru-IP забанен Cloudflare-WAF, льём через germ, фолбэк на neth, затем прямой.
      UNCIV_UPLOAD_PROXY: "http://89.125.90.69:8888,http://185.223.93.39:8888"
    volumes:
      - ${CIV_PATH}:/data/unciv
      # Place Unciv.jar next to docker-compose.yml for local launcher
      - ./Unciv.jar:/opt/unciv/Unciv.jar
      # Read-only: core-service user cards (playerId -> telegram nick) for the viewer.
      - /var/docker/compose/unciv-core-service/data:/data/core:ro
    # Unciv.jar при генерации SYNC/локальных игр ходит на http://icanseeforever.com:8084.
    # Резолвим этот хост напрямую в контейнер unciv-server по civ_network (172.21.0.4),
    # минуя внешний DNS + hairpin на публичный IP — тот интермиттил UnknownHostException
    # и ронял старт. В репо (а не только в локальном compose на сервере), чтобы деплой
    # (git reset --hard) не затирал фикс. Если IP unciv-server сменится — обновить здесь
    # (устойчивее было бы дать unciv-server сетевой alias «icanseeforever.com»).
    extra_hosts:
      - "icanseeforever.com:172.21.0.4"
    networks:
      - civ_network

networks:
  civ_network:
    external: true
