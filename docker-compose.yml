services:
  unciv-game-service:
    build: .
    container_name: unciv-game-service
    restart: unless-stopped
    ports:
      - "8085:8080"
    env_file:
      - .env
    environment:
      # CIV_PATH in .env is the host path used for volume mount above;
      # inside the container the data is always at /data/unciv
      CIV_PATH: /data/unciv
    volumes:
      # Mount the Unciv MultiplayerFiles directory
      - ${CIV_PATH}:/data/unciv
    networks:
      - civ_network

networks:
  civ_network:
    external: true
